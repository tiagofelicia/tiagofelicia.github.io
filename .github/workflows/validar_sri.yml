name: Validar SRI Hashes (CDN)

# Verifica diariamente se os hashes SRI (integrity=) declarados nos HTMLs
# ainda batem com o conteúdo atual servido pelo CDN.
#
# Se um CDN republicar um ficheiro, o hash deixa de bater e o browser bloqueia
# o script. Este workflow alerta-nos antes que isso aconteça em produção.

on:
  schedule:
    - cron: '15 6 * * *'  # Todos os dias às 06:15 UTC (07:15 inverno PT)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/validar_sri.py'
      - '.github/workflows/validar_sri.yml'

permissions:
  contents: read
  issues: write   # para criar/atualizar issue de alerta

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar hashes SRI
        id: sri_check
        continue-on-error: true
        run: |
          python scripts/validar_sri.py | tee sri_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Criar/atualizar issue de alerta se houver mismatches
        if: steps.sri_check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('sri_report.txt', 'utf8');
            const title = '⚠️ SRI: hash mismatch detetado num CDN';
            const body = [
              'O workflow **Validar SRI Hashes (CDN)** detetou hashes `integrity=` que já não correspondem ao conteúdo servido pelo CDN.',
              'Os browsers estão a **bloquear** estes scripts nas páginas afetadas — corrigir com prioridade.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Procurar issue aberta já existente (evitar duplicados diários)
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sri-alert',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sri-alert'],
              });
            }

      - name: Falhar workflow se houver mismatches
        if: steps.sri_check.outputs.exit_code != '0'
        run: |
          echo "::warning::Detectados hashes SRI inválidos. Ver sri_report.txt."
          cat sri_report.txt
          exit 1

      - name: Upload relatório como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sri-report
          path: sri_report.txt
          retention-days: 30
